packages:
  "framer-motion": "For page transitions and smooth UI animations"
  "recharts": "For dashboard applicant statistics charts"
  "date-fns": "For formatting application dates easily"
  "@hookform/resolvers": "For Zod form validation"
  "react-hook-form": "For robust form state"
  "clsx": "class merging utility"
